name: Air-gapped build (Windows x64 portable)

# Два способа запустить:
#   1) вручную: Actions -> "Air-gapped build" -> Run workflow
#   2) автоматически: git push тега вида v0.10.1-airgapped-2
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например v0.10.1-airgapped-2)"
        required: true
        default: "v0.10.1-airgapped-2"
  push:
    tags:
      - "v*-airgapped*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/stt-http-endpoint

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: airgapped

      - name: Install frontend dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Build app (no installer, portable folder)
        run: bun run tauri build --no-bundle

      - name: Assemble portable archive
        shell: pwsh
        run: |
          $out = "portable/Handy-airgapped"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "src-tauri/target/release/handy.exe" $out
          Copy-Item -Recurse "src-tauri/resources" "$out/resources"

          # transcribe-cpp stages its runtime libraries deep inside target\,
          # not next to the exe — collect them by name, newest first.
          $want = '^(transcribe|ggml|onnxruntime)'
          Get-ChildItem -Recurse -Path "src-tauri/target" -Filter *.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match $want } |
            Sort-Object LastWriteTime -Descending |
            Group-Object Name |
            ForEach-Object { Copy-Item $_.Group[0].FullName $out }

          # MSVC runtime the exe and those DLLs link against.
          $crt = @('msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll','msvcp140_atomic_wait.dll',
                   'msvcp140_codecvt_ids.dll','vcruntime140.dll','vcruntime140_1.dll',
                   'vcruntime140_threads.dll','vcomp140.dll','concrt140.dll')
          foreach ($dll in $crt) {
            $src = Join-Path $env:SystemRoot "System32/$dll"
            if (Test-Path $src) { Copy-Item $src $out }
          }

          $missing = @()
          foreach ($needed in @('handy.exe','transcribe.dll','ggml.dll','msvcp140.dll','vcruntime140.dll')) {
            if (-not (Test-Path (Join-Path $out $needed))) { $missing += $needed }
          }
          if ($missing.Count -gt 0) { throw ("archive would not run, missing: " + ($missing -join ', ')) }

          Write-Host "Contents:"
          Get-ChildItem $out | Select-Object Name, Length | Format-Table -AutoSize
          Compress-Archive -Path "$out/*" -DestinationPath "Handy-airgapped-win64.zip" -CompressionLevel Optimal
          Write-Host ("Archive size: " + (Get-Item "Handy-airgapped-win64.zip").Length)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Handy-airgapped-win64
          path: Handy-airgapped-win64.zip
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Handy-airgapped-win64.zip
          prerelease: true
          body: |
            Автоматическая сборка из ветки `feature/stt-http-endpoint`.

            Windows x64, портативно: распаковать и запустить `handy.exe`.

            Настройки -> Advanced -> Experimental -> "Распознавание без интернета":
            указать адрес OpenAI-совместимого сервера, модель и язык.

      - name: Publish release (manual run)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$env:TAG" "Handy-airgapped-win64.zip" `
            --target feature/stt-http-endpoint `
            --title "Handy air-gapped build $env:TAG" `
            --notes "Автоматическая сборка из ветки ``feature/stt-http-endpoint``. Портативно: распаковать и запустить ``handy.exe``." `
            --prerelease
